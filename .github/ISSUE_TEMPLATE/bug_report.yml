name: Bug report
description: Report a reproducible problem with Roundtable.
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide as much detail as possible so it can be reproduced and fixed.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact steps that trigger the issue.
      placeholder: |
        1. Open Roundtable
        2. Set model lineup to...
        3. Start a conversation...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, Node.js version, browser, and model/provider information.
      placeholder: |
        - OS:
        - Node.js:
        - Browser:
        - Model/provider:
        - FreeLLMAPI version:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste logs, screenshots, or error output if available.
      placeholder: Add screenshots or relevant output.
