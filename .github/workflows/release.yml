name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows on ThinkCentre
    runs-on: [self-hosted, Windows]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Tauri App (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './roundtable'
          tagName: v__VERSION__
          releaseName: 'Roundtable v__VERSION__'
          releaseBody: 'Roundtable desktop application release.'
          releaseDraft: false
          prerelease: false


