name: Release Windows

# Builds, signs and publishes the Windows desktop release.
#
# The release tag is DERIVED from src-tauri/tauri.conf.json, so a tag can never
# disagree with the binaries inside it. Two ways to publish:
#
#   git tag v0.2.1 && git push origin v0.2.1      # tag push publishes
#   gh workflow run release.yml --ref v0.2.1      # or dispatch against the tag
#
# Dispatching a branch also works while the version is not tagged yet (the tag
# is created at that commit). Dispatching a branch whose tag already points at
# different code fails on purpose.
#
# macOS is built and notarized locally (scripts/build-and-notarize.sh) and
# publishes its own darwin-aarch64 entry. This job MERGES its windows-x86_64
# entry into the manifest already attached to the release, so neither platform
# can erase the other's update path.
#
# Requires the repo secret TAURI_SIGNING_PRIVATE_KEY (key id 6E8C99D71D9B2B5A)
# and, only if that key is password protected,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      REPO: ${{ github.repository }}

    steps:
      - name: Check out the release ref
        uses: actions/checkout@v4
        with:
          # Tags are needed to prove that the tag matches the built commit.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Read version and validate the tag
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unexpected version in tauri.conf.json: '$version'"
          }
          $tag = "v$version"

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) {
              throw "Dispatched from tag '$env:GITHUB_REF_NAME' but tauri.conf.json says $version (expected $tag)."
            }
            Write-Host "Releasing tag $tag (matches tauri.conf.json)."
          } else {
            $existing = git tag --list $tag
            if ($existing) {
              $tagCommit = (git rev-list -n 1 $tag).Trim()
              $head = (git rev-parse HEAD).Trim()
              if ($tagCommit -ne $head) {
                throw "Tag $tag already points at $tagCommit but HEAD is $head. Bump the version in tauri.conf.json, or dispatch against $tag."
              }
              Write-Host "Tag $tag already points at HEAD."
            } else {
              Write-Host "Tag $tag does not exist yet; it will be created at this commit."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Windows bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass -File .\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-windows.ps1 failed (exit $LASTEXITCODE)" }

      - name: Sign and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"

          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY repo secret is not set - cannot sign the update."
          }

          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*_${version}_x64-setup.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer for $version not found under src-tauri\target\release\bundle\nsis" }

          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*_${version}_x64_en-US.msi" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msi) { throw "MSI for $version not found under src-tauri\target\release\bundle\msi" }

          Write-Host "NSIS: $($nsis.FullName)  ($($nsis.Length) bytes)"
          Write-Host "MSI : $($msi.FullName)  ($($msi.Length) bytes)"

          # Create the release if this is a brand new version.
          gh release view $tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag"
            gh release create $tag --repo $env:REPO `
              --title "Roundtable $tag" `
              --notes "Roundtable desktop release $tag."
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }

          # The manifest already on the release (keeps darwin-aarch64 alive).
          $out = Join-Path "releases" $tag
          New-Item -ItemType Directory -Force $out | Out-Null
          $manifestPath = Join-Path $out "updates.json"
          $base = $null
          gh release download $tag --repo $env:REPO --pattern updates.json --dir $out --clobber *> $null
          if (Test-Path $manifestPath) {
            $base = Get-Content $manifestPath -Raw | ConvertFrom-Json
            Write-Host "Base manifest: v$($base.version) with platforms $($base.platforms.PSObject.Properties.Name -join ', ')"
            if ([version]$base.version -gt [version]$version) {
              throw "Published manifest is v$($base.version) but this build is v$version - refusing to downgrade."
            }
          } else {
            Write-Host "No published manifest yet - starting a fresh one."
          }

          $manifestArgs = @("scripts/updates-manifest.js", "--version", $version)
          if ($base) { $manifestArgs += @("--base", $manifestPath) }
          $manifestArgs += @("--platform", "windows-x86_64=$($nsis.FullName)")
          $manifestArgs += @("--out", $manifestPath)
          node @manifestArgs
          if ($LASTEXITCODE -ne 0) { throw "updates-manifest.js failed" }

          # Never publish a manifest the apps would reject or that silently
          # drops the other platform.
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.platforms.'windows-x86_64') {
            throw "Manifest has no windows-x86_64 entry."
          }
          if ($base -and $base.platforms.'darwin-aarch64' -and -not $manifest.platforms.'darwin-aarch64') {
            throw "Manifest lost the darwin-aarch64 entry."
          }

          # Installers first, manifest last: the manifest must never point at
          # an asset that is not there yet.
          gh release upload $tag --repo $env:REPO --clobber $nsis.FullName $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "failed to upload installers" }

          gh release upload $tag --repo $env:REPO --clobber $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "failed to upload updates.json" }

          Write-Host ""
          Write-Host "Published $tag with platforms:"
          $manifest.platforms.PSObject.Properties.Name | ForEach-Object { Write-Host "  - $_" }
